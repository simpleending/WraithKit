name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.96 --profile minimal -c clippy,rustfmt && rustup default 1.96
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - name: Four-app offline approval, denial and stale-input smoke tests
        shell: pwsh
        run: .github/scripts/smoke-demos.ps1 -BinDir target/debug
      - name: Two-Wraith offline handoff and fresh-approval smoke
        run: python .github/scripts/check-wraithbridge.py target/debug
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Landing page checks
        run: |
          node --check site/js/main.js
          node --check site/js/chain.js
          node site/tools/check-chain.mjs
          node .github/scripts/check-ui.mjs
      - name: Verify public source exclusions
        run: python .github/scripts/check-public-tree.py
      - name: Verify bundled third-party notices
        run: python .github/scripts/third_party_notices.py --verify
      - name: .kiro must not be gitignored (Kiroween rule)
        shell: bash
        run: |
          test -n "$(git ls-files -- .kiro)" || { echo ".kiro is missing or untracked"; exit 1; }
          if git check-ignore --no-index -q .kiro; then echo ".kiro is ignored"; exit 1; fi
          while IFS= read -r file; do
            if git check-ignore --no-index -q "$file"; then echo "$file is ignored"; exit 1; fi
          done < <(git ls-files -- .kiro)
