[workspace]
resolver = "3"
members = ["wraithkit", "apps/repo-wraith", "apps/research-wraith", "apps/security-wraith", "apps/release-wraith"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.2", features = ["json"] }
tiny_http = "0.12.0"
wraithkit = { path = "wraithkit" }

[profile.release]
strip = true
lto = "thin"
